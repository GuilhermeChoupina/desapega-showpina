<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#580A9E">
  <meta name="description" content="Desapega Showpina: itens usados em ótimas condições, mostrados ao vivo.">
  <title>Desapega Showpina</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="assets/icon.jpg?v=1" type="image/jpeg">
  <link rel="shortcut icon" href="assets/icon.jpg?v=1" type="image/jpeg">
</head>
<body>
  <header class="header">
    <div class="header__accent" aria-hidden="true"></div>
    <div class="container header__inner">
      <a class="brand" href="#" aria-label="Desapega Showpina - início">
        <img src="assets/logo.jpg" alt="Logo Desapega Showpina" class="brand__mark">
        <span class="brand__name">Desapega <strong>Showpina</strong></span>
      </a>

      <div class="trust">
        <img class="trust__avatar" src="assets/avatar.png"
             alt="Avatar de Guilherme, criador da Desapega Showpina">
        <span class="trust__text">
          <strong>Compra com confiança</strong> Atendimento e entrega feitos por mim
        </span>
      </div>
    </div>
  </header>

  <main>
    <section class="catalog" aria-labelledby="catalog-title">
      <div class="container">
        <div class="catalog__heading">
          <div>
            <p class="eyebrow">Bazar da live</p>
            <h1 id="catalog-title">Achados para desapegar</h1>
          </div>

          <div class="catalog__filters">
            <nav class="filters category-tabs" aria-label="Categorias de produtos">
              <button class="filter category-tab is-active" type="button" data-category="Tecnologia" aria-pressed="true">
                Tecnologia <span class="filter__count" data-category-count aria-hidden="true"></span>
              </button>
              <button class="filter category-tab" type="button" data-category="Outros" aria-pressed="false">
                Outros <span class="filter__count" data-category-count aria-hidden="true"></span>
              </button>
            </nav>

            <nav class="filters" aria-label="Filtrar produtos por status">
              <button class="filter status-filter is-active" type="button" data-filter="Disponível" aria-pressed="true">
                Disponíveis <span class="filter__count" data-status-count aria-hidden="true"></span>
              </button>
              <button class="filter status-filter" type="button" data-filter="Vendido" aria-pressed="false">
                Vendidos <span class="filter__count" data-status-count aria-hidden="true"></span>
              </button>
            </nav>
          </div>
        </div>

        <div class="product-grid" id="product-grid" aria-live="polite"></div>
      </div>
    </section>

    <section class="live-cta" aria-label="Acompanhe as lives">
      <div class="container live-cta__inner">
        <div>
          <p class="eyebrow">Ao vivo</p>
          <h2>YouTube, Kick e Twitch.</h2>
        </div>
        <a class="button button--light" id="live-link" href="https://linktr.ee/Showpina" target="_blank" rel="noopener noreferrer">
          Ver próxima live
          <span aria-hidden="true">↗</span>
        </a>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <div>
        <a class="brand brand--footer" href="#">
          <img src="assets/logo.jpg" alt="Logo Desapega Showpina" class="brand__mark">
          <span class="brand__name">Desapega <strong>Showpina</strong></span>
        </a>
        <p>Pagamento combinado pelo WhatsApp.<br>Entrega ou retirada na região do ABC.</p>
      </div>
      <nav class="footer__links" aria-label="Redes sociais">
        <a href="https://www.instagram.com/shwpina/" target="_blank" rel="noopener noreferrer">Instagram</a>
        <a href="https://www.tiktok.com/@shwpina?lang=pt-BR" target="_blank" rel="noopener noreferrer">Tik Tok</a>
        <a href="https://www.youtube.com/@Showpina" target="_blank" rel="noopener noreferrer">YouTube</a>
        <a href="https://kick.com/Showpina" target="_blank" rel="noopener noreferrer">Kick</a>
        <a href="https://www.twitch.tv/showpina" target="_blank" rel="noopener noreferrer">Twitch</a>
      </nav>
    </div>
  </footer>

  <dialog class="lightbox" id="lightbox" aria-label="Ampliação da foto">
    <button class="lightbox__close" type="button" aria-label="Fechar imagem">&times;</button>
    <img class="lightbox__image" id="lightbox-image" src="" alt="">
    <button class="lightbox__arrow lightbox__arrow--previous" type="button"
            aria-label="Foto anterior">&#8249;</button>
    <button class="lightbox__arrow lightbox__arrow--next" type="button"
            aria-label="Próxima foto">&#8250;</button>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
